stages:
  - validate
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

validate:
  stage: validate
  tags:
    - general-linux
  cache:
    key: python-dependencies
    paths:
      - .cache/pip/
  before_script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
    - python -m pip install -e .
  script:
    - ruff check .
    - pytest
    - python scripts/database/create_index.py --environment dev
    - python scripts/ops_manager/create_collection_reader.py --environment dev
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'

.deploy:
  stage: deploy
  tags:
    - mongodb-deploy
  interruptible: false
  before_script:
    - python3 -m venv .venv
    - . .venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python -m pip install -e .
  script:
    - bin/deploy.sh
  resource_group: "mongodb-${DEPLOY_ENV}"
  needs:
    - validate

deploy_dev:
  extends: .deploy
  variables:
    DEPLOY_ENV: dev
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy_sat:
  extends: .deploy
  variables:
    DEPLOY_ENV: sat
  environment:
    name: sat
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

deploy_prod:
  extends: .deploy
  variables:
    DEPLOY_ENV: prod
  environment:
    name: prod
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
