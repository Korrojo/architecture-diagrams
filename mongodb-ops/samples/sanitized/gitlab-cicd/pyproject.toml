[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mongodb-gitlab-cicd-sample"
version = "0.1.0"
description = "Sanitized GitLab CI/CD sample for MongoDB and Ops Manager changes"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "pymongo>=4.10,<5",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
