environment: dev

aws:
  region_variable: AWS_REGION

mongodb:
  uri_parameter: /mongodb-cicd/dev/mongodb/connection-uri
  deployment_secret: mongodb-cicd/dev/mongodb/deployment-user
  database: sample_app_dev
  collection: orders
  index:
    name: ix_customerId
    keys:
      - field: customerId
        direction: 1
    unique: false

ops_manager:
  base_url_parameter: /mongodb-cicd/dev/ops-manager/base-url
  project_id_parameter: /mongodb-cicd/dev/ops-manager/project-id
  api_key_secret: mongodb-cicd/dev/ops-manager/api-key
  new_user_secret: mongodb-cicd/dev/mongodb/orders-reader
  database: sample_app_dev
  collection: orders
  role_name: ordersCollectionReader
  authentication_database: sample_app_dev

