environment: test

mongodb:
  uri_parameter: /mongodb-local-cicd/test/mongodb/uri
  deployment_secret: mongodb-local-cicd/test/mongodb/deployer
  database: cicd_demo_test
  migration_collection: _schema_migrations
  collection: customers
  index:
    name: ux_customers_email
    keys:
      - field: email
        direction: 1
    unique: true

ops_manager:
  base_url_parameter: /mongodb-local-cicd/test/ops-manager/base-url
  project_id_parameter: /mongodb-local-cicd/test/ops-manager/project-id
  api_key_secret: mongodb-local-cicd/test/ops-manager/api-key
  managed_user_secret: mongodb-local-cicd/test/mongodb/demo-user
  authentication_database: cicd_demo_test
  role:
    name: cicdDemoCustomerReader
    database: cicd_demo_test
    collection: customers
    actions: [find]
  alert:
    event_type: HOST_DOWN
    enabled: true
    notifications:
      - typeName: GROUP
        roles: [GROUP_OWNER]
        delayMin: 5
        intervalMin: 60

