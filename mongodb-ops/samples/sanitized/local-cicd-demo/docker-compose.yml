services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb-local-cicd-demo
    restart: unless-stopped
    env_file:
      - .local/docker.env
    ports:
      - "27017:27017"
    volumes:
      - mongodb-local-cicd-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongodb-local-cicd-data:

